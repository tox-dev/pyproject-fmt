name: Mirror
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "30 8 * * *"
permissions: {}
jobs:
  mirror:
    uses: tox-dev/github-workflows/.github/workflows/publish-pre-commit-mirror.yaml@bceb5c005e19823dc8835f536f53f172ae223927 # 6.5.0
    permissions:
      contents: write
    with:
      package-name: pyproject-fmt
      files-regex: '(^|/)pyproject\.toml$'
